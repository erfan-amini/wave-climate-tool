# Exact environment used for the paper (revision 1). Create with:
#   conda env create -f environment.yml && conda activate wave-climate-tool
name: wave-climate-tool
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - streamlit==1.66.1
      - pandas==3.0.5
      - numpy==2.5.3
      - scipy==1.18.1
      - plotly==7.1.0
      - requests==2.34.2
      - cdsapi==0.7.7
      - xarray==2026.9.0
      - netCDF4==1.7.5.1.post1
      - matplotlib==3.11.2
      - pyextremes==2.7.0
      - pytest==9.1.1
